    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function() {
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && (url.includes('vite-hmr') || protocols === 'vite-hmr' || url.includes(':24678') || url.includes('token='))) {
              return {
                readyState: 1,
                OPEN: 1,
                CLOSED: 3,
                CONNECTING: 0,
                CLOSING: 2,
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  if (type === 'open') setTimeout(fn, 0);
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
              };
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
        }
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && typeof e.reason.message === 'string' && (e.reason.message.includes('WebSocket') || e.reason.message.includes('vite'))) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          if (e && typeof e.message === 'string' && (e.message.includes('WebSocket') || e.message.includes('vite'))) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
